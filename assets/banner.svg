<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Nabil Yasini-Ardekani — computational chemistry and machine learning">
  <defs>
    <linearGradient id="turq" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0E7C86"/>
      <stop offset="55%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#5EEAD4"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#14B8A6" stroke-opacity="0.13" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="220" fill="#0B1220"/>
  <rect width="1200" height="220" fill="url(#grid)"/>
  <rect x="0" y="0" width="6" height="220" fill="url(#turq)"/>

  <!-- lattice motif: nodes and bonds, right side -->
  <g stroke="#14B8A6" stroke-opacity="0.5" stroke-width="1.4" fill="none">
    <path d="M905 62 L975 40 L1045 62 L1045 122 L975 144 L905 122 Z"/>
    <path d="M975 40 L975 8"/>
    <path d="M1045 62 L1105 44"/>
    <path d="M1045 122 L1105 140"/>
    <path d="M975 144 L975 178"/>
    <path d="M905 122 L845 140"/>
    <path d="M905 62 L845 44"/>
    <path d="M905 62 L1045 122 M905 122 L1045 62"/>
  </g>
  <g fill="#5EEAD4">
    <circle cx="905" cy="62" r="5"/><circle cx="975" cy="40" r="5"/>
    <circle cx="1045" cy="62" r="5"/><circle cx="1045" cy="122" r="5"/>
    <circle cx="975" cy="144" r="5"/><circle cx="905" cy="122" r="5"/>
  </g>
  <g fill="#14B8A6" fill-opacity="0.85">
    <circle cx="975" cy="8" r="3.5"/><circle cx="1105" cy="44" r="3.5"/>
    <circle cx="1105" cy="140" r="3.5"/><circle cx="975" cy="178" r="3.5"/>
    <circle cx="845" cy="140" r="3.5"/><circle cx="845" cy="44" r="3.5"/>
  </g>

  <text x="52" y="88" font-family="'IBM Plex Mono','SFMono-Regular',Consolas,monospace"
        font-size="38" font-weight="600" fill="#F1F5F9" letter-spacing="0.5">
    Nabil Yasini-Ardekani
  </text>
  <text x="52" y="126" font-family="'IBM Plex Sans','Segoe UI',system-ui,sans-serif"
        font-size="19" fill="#5EEAD4" letter-spacing="0.3">
    computational chemistry × machine learning
  </text>
  <text x="52" y="164" font-family="'IBM Plex Mono','SFMono-Regular',Consolas,monospace"
        font-size="14.5" fill="#94A3B8">
    molecular property prediction · materials screening · evaluation you can trust
  </text>
  <rect x="52" y="180" width="132" height="3" fill="url(#turq)"/>
</svg>
